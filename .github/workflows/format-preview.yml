name: Format preview

on:
  push:
    branches:
      - release/1.5.8-beta.7-stability

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/AppErrorBoundary.jsx src/StabilityPolish.css
      - name: Print formatted files
        run: |
          echo "APP_ERROR_BOUNDARY_START"
          base64 -w 0 src/AppErrorBoundary.jsx
          echo
          echo "APP_ERROR_BOUNDARY_END"
          echo "STABILITY_POLISH_START"
          base64 -w 0 src/StabilityPolish.css
          echo
          echo "STABILITY_POLISH_END"
