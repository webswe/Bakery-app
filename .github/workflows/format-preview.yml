name: Format preview

on:
  push:
    branches:
      - feature/editable-calendar-bulk-stock

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/editable-calendar-bulk-stock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write test/inventory-lots.test.js
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/inventory-lots.test.js
          git diff --cached --quiet || git commit -m "Format bulk inventory test"
          git push
