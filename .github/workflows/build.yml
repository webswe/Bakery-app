name: Build and test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Preview formatted launch files
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          files=(
            src/homeBakeryLaunch.js
            src/HomeBakeryLaunchStyles.css
            src/HomeBakeryLaunchWorkspace.jsx
            test/home-bakery-launch.test.js
          )
          npx prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            echo "FORMAT_BEGIN:${file}"
            base64 -w 0 "${file}"
            echo
            echo "FORMAT_END:${file}"
          done
      - run: npm test
      - run: npm run format:check
      - run: npm run build
