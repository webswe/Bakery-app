name: Format expense preview

on:
  push:
    branches:
      - feature/complete-expense-ledger

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/ExpenseFields.jsx src/expenses.js src/main.jsx src/UserGuideWorkspace.jsx
      - name: Print formatted files
        run: |
          for file in src/ExpenseFields.jsx src/expenses.js src/main.jsx src/UserGuideWorkspace.jsx; do
            marker=$(echo "$file" | tr '/.' '__' | tr '[:lower:]' '[:upper:]')
            echo "${marker}_START"
            base64 -w 0 "$file"
            echo
            echo "${marker}_END"
          done
